<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compade · 3D maskot denemesi</title>
  <style>
    :root{color-scheme:dark;--bg:#0f172a;--panel:#172238;--line:#29364c;--muted:#91a0b6;--text:#e7eef8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
    main{width:min(1120px,calc(100% - 40px));margin:38px auto 64px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}
    h1{font-size:25px;letter-spacing:-.04em;margin:0;font-weight:650}.intro p{margin:7px 0 0;color:var(--muted)}
    .fps{font:12px ui-monospace,monospace;color:#9db0c8;padding:8px 11px;border:1px solid var(--line);border-radius:7px}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel,.card{background:linear-gradient(145deg,#18243a,#141e31);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .compare-box{height:260px;display:grid;place-items:center}.compare-box img{width:260px;height:260px;object-fit:contain;border-radius:8px}.render{width:260px;height:260px;display:grid;place-items:center}
    .label{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-top:1px solid var(--line);font-size:13px}.label small{color:var(--muted)}
    h2{font-size:16px;font-weight:600;margin:31px 0 13px;letter-spacing:-.02em}.states{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.card .render{width:100%;height:180px}.card .label{padding:10px 12px}.card .label small{font-size:11px}
    .grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}.tiny{height:76px;border:1px solid var(--line);background:#172238;border-radius:9px;overflow:hidden}.tiny .render{width:64px;height:64px;margin:auto}.tiny span{display:block;text-align:center;color:#8292a9;font:10px ui-monospace,monospace;padding-bottom:4px}
    @media(max-width:900px){.states{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(7,1fr)}}@media(max-width:600px){main{width:calc(100% - 24px);margin-top:24px}.intro{align-items:start;gap:12px}.compare{grid-template-columns:1fr}.compare-box{height:240px}.render{height:240px}.states{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.fps{white-space:nowrap}}
  </style>
</head>
<body>
  <main>
    <header class="intro"><div><h1>Maskot / malzeme ve durum</h1><p>Referansla gerçek zamanlı Three.js karşılaştırması</p></div><div class="fps" id="fps">FPS —</div></header>
    <section class="compare" aria-label="Referans karşılaştırması">
      <article class="panel"><div class="compare-box"><img src="/ref/maskot-referans.png" alt="Maskot 3D referans görseli"></div><div class="label"><span>Referans</span><small>stüdyo · kil/plastik</small></div></article>
      <article class="panel"><div class="compare-box"><div class="render" data-state="idle" data-color="#64748b"></div></div><div class="label"><span>Prototip</span><small>idle · #64748b</small></div></article>
    </section>
    <h2>Durum örnekleri</h2>
    <section class="states" id="states"></section>
    <h2>Çoklu maskot yükü <span style="color:var(--muted);font-weight:400">· 29 örnek</span></h2>
    <section class="grid" id="grid" aria-label="29 maskot performans ızgarası"></section>
  </main>
  <script type="module">
    import { Mascot3D } from './mascot3d.js';
    const states = [
      ['idle','#38bdf8'],['working','#22c55e'],['working','#f59e0b',true],
      ['waiting','#a78bfa'],['success','#f472b6'],['error','#94a3b8'],['sleeping','#38bdf8']
    ];
    const stateRoot = document.querySelector('#states');
    states.forEach(([state,color,chief]) => {
      const card = document.createElement('article'); card.className='card';
      card.innerHTML=`<div class="render" data-state="${state}" data-color="${color}" data-chief="${!!chief}"></div><div class="label"><span>${state}${chief?' + chief':''}</span><small>${color}</small></div>`;
      stateRoot.append(card);
    });
    const grid=document.querySelector('#grid');
    const colors=['#38bdf8','#22c55e','#f59e0b','#a78bfa','#f472b6','#94a3b8'];
    for(let i=0;i<29;i++){
      const cell=document.createElement('div');cell.className='tiny';
      cell.innerHTML=`<div class="render" data-state="${i<3?'working':'sleeping'}" data-color="${colors[i%colors.length]}"></div><span>${i<3?'work':'sleep'}</span>`;grid.append(cell);
    }
    document.querySelectorAll('.render').forEach(el => Mascot3D.mount(el, {state:el.dataset.state,color:el.dataset.color,chief:el.dataset.chief==='true',size:el.clientWidth||180}));
    Mascot3D.onFps(value => document.querySelector('#fps').textContent=`${value} FPS`);
  </script>
</body>
</html>
