<!doctype html>
<html lang="tr" data-theme="green">
<head>
<script>try{var t=localStorage.getItem('compade-theme');if(['green','blue','red','purple','black'].includes(t))document.documentElement.dataset.theme=t}catch(_){document.documentElement.dataset.theme='green'}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Compade</title>
<style>
:root{
  color-scheme:dark;--bg:#111413;--panel:#171b19;--panel2:#1c211f;--panel3:#232927;
  --line:#303834;--line2:#414b45;--text:#e5eae7;--muted:#a1aaa5;--dim:#77817b;

  --green:#78b58c;--ok:#75bd8a;--warn:#d9a84e;--err:#ff8a5c;--accent:#35c8ad;--teal:var(--accent);--teal2:var(--accent);--shadow:0 3px 12px #0004;--radius:6px;
  font:14px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif
}
[data-theme="green"]{--bg:#111413;--panel:#171b19;--panel2:#1c211f;--panel3:#232927;--line:#303834;--line2:#414b45;--text:#e5eae7;--muted:#a1aaa5;--dim:#77817b;--accent:#35c8ad;--ok:#75bd8a;--warn:#d6a34e;--err:#ff8a5c}
[data-theme="blue"]{--bg:#0d1118;--panel:#131a24;--panel2:#192231;--panel3:#202c3d;--line:#293648;--line2:#394b61;--text:#e7edf5;--muted:#a3b0c1;--dim:#74849a;--accent:#5aa9ff;--ok:#75bd8a;--warn:#e3b65e;--err:#ff8a5c}
[data-theme="red"]{--bg:#130e0e;--panel:#1c1414;--panel2:#261919;--panel3:#332020;--line:#49302f;--line2:#61403e;--text:#f1e8e7;--muted:#c0aaa8;--dim:#8e7472;--accent:#ff6b6b;--ok:#75bd8a;--warn:#e3b65e;--err:#ff8a5c}
[data-theme="purple"]{--bg:#100d16;--panel:#181322;--panel2:#211a2e;--panel3:#2c233c;--line:#40334f;--line2:#55456a;--text:#eee9f5;--muted:#b4a9c3;--dim:#827792;--accent:#a78bfa;--ok:#75bd8a;--warn:#e3b65e;--err:#ff8a5c}
[data-theme="black"]{--bg:#000;--panel:#0a0a0a;--panel2:#101010;--panel3:#171717;--line:#1f1f1f;--line2:#343434;--text:#f0f0f0;--muted:#b8b8b8;--dim:#858585;--accent:#e6e6e6;--ok:#75bd8a;--warn:#e3b65e;--err:#ff8a5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-width:360px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}
svg{display:block}
.shell{height:100dvh;min-height:650px;display:grid;grid-template-columns:54px 250px minmax(0,1fr) var(--tbw,280px);grid-template-rows:38px minmax(0,1fr) 30px;overflow:hidden;background:var(--bg)}
.titlebar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.window-dots{display:flex;gap:6px;margin-right:6px}.window-dots i{width:9px;height:9px;border-radius:50%;background:#47534c}
.titlebar .brand-mini{display:flex;align-items:center;gap:7px;color:var(--text);font-weight:650}.brand-mini svg{width:16px;height:16px}
.title-center{margin:auto;opacity:.75}.title-actions{display:flex;gap:6px}
.icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:5px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--panel3);color:var(--text)}.icon-btn svg{width:16px;height:16px}
.activity{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:8px}
.activity button{position:relative;width:40px;height:40px;border-radius:9px;color:var(--dim);border:0;background:transparent}
.activity button:hover,.activity button.active{color:var(--text);background:#ffffff09}
.activity button.active:before{content:"";position:absolute;left:-7px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--teal)}
.activity svg{width:18px;height:18px;margin:0;flex:none}.activity .spacer{flex:1}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto}
.side-heading{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 7px 13px}
.workspace-name{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;background:#ffffff06;font-size:12px;margin-bottom:20px}
.workspace-name svg{width:15px;color:var(--amber)}
.side-label{margin:18px 7px 7px;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.11em}
.nav-item{width:100%;border:0;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;color:var(--muted);padding:8px;border-radius:8px;margin:2px 0;font-size:13px}
.nav-item:hover,.nav-item.active{background:#ffffff09;color:var(--text)}
.nav-item.active{box-shadow:inset 2px 0 var(--teal)}
.nav-item svg{width:16px;height:16px;color:inherit}
.nav-count{margin-left:auto;font:11px "Cascadia Code",Consolas,monospace;color:var(--dim)}
.side-agent{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:12px;color:var(--muted)}
.agent-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px #62d68a55}
.agent-dot.running{background:var(--blue);box-shadow:0 0 9px #67bff355;animation:pulse 1.4s infinite}
.agent-dot.limit{background:var(--amber)}.agent-dot.offline{background:var(--dim)}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:36px minmax(0,1fr) auto;background:var(--bg)}
.tabs{height:36px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel);overflow:auto}
.editor-tab{border:0;border-right:1px solid var(--line);padding:0 14px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:9px;font-size:12px;white-space:nowrap}
.editor-tab.active{background:var(--bg);color:var(--text);border-top:1px solid var(--teal)}
.editor-tab span{color:var(--amber);font:12px "Cascadia Code",Consolas,monospace}
.content{overflow:auto;min-height:0;position:relative}
.page{max-width:1450px;margin:0 auto;padding:30px clamp(18px,3vw,44px) 42px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{color:var(--teal);font:11px "Cascadia Code",Consolas,monospace;letter-spacing:.09em;text-transform:uppercase}
h1,h2,h3,p{margin-top:0}h1{font-size:27px;line-height:1.15;letter-spacing:-.04em;margin:5px 0 4px}h2{font-size:16px;margin-bottom:4px}h3{font-size:14px;margin-bottom:5px}
.subtle{color:var(--muted)}.small{font-size:12px}.mono{font-family:"Cascadia Code","Cascadia Mono",Consolas,monospace}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;transition:transform .18s,border-color .18s,background .18s}
.btn:hover{transform:translateY(-1px);border-color:#60746a;background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);box-shadow:none}
.btn.ghost{background:transparent}.btn.danger{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;position:relative;overflow:hidden}
.card.spotlight{--mx:50%;--my:50%;isolation:isolate}
.card.spotlight:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(360px circle at var(--mx) var(--my),#37c8ad20,transparent 65%)}
.card.spotlight:hover:before{opacity:1}
.card.beam:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 20%,#37c8ad9c 45%,#f5b54480 58%,transparent 80%);background-size:230% 100%;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.card.beam:hover:after{opacity:1;animation:beam 2.4s linear infinite}
@keyframes beam{to{background-position:-230% 0}}@keyframes pulse{50%{opacity:.45;transform:scale(.84)}}
.hero{position:relative;overflow:hidden;padding:38px clamp(20px,4vw,54px) 26px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(ellipse at 79% 2%,#1c725a44,transparent 36%),radial-gradient(ellipse at 18% 20%,#a06d2824,transparent 32%),linear-gradient(135deg,#19211e,var(--bg) 72%);margin-bottom:22px}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E")}
.hero:after{content:"";position:absolute;width:360px;height:210px;right:8%;top:-150px;background:#36b49b30;filter:blur(70px);border-radius:50%;pointer-events:none;animation:aurora 9s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(-38px,95px) scale(1.2);opacity:.55}}
.hero-inner{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:30px}
.logo-lockup{display:flex;align-items:center;gap:11px;margin-bottom:22px}.logo-lockup svg{width:31px;height:31px;filter:drop-shadow(0 0 12px #20b89a55)}
.logo-lockup span{font-size:12px;color:#b3c1b9;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:clamp(38px,5.5vw,68px);letter-spacing:-.065em;margin:0 0 8px;background:linear-gradient(100deg,var(--text) 10%,var(--text) 40%,#8be4cc 52%,var(--text) 68%);background-size:240% auto;color:transparent;background-clip:text;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,70%{background-position:100% center}100%{background-position:-100% center}}
.hero p{max-width:590px;color:#a9b8b0;margin:0}.hero-aside{font:11px "Cascadia Code",Consolas,monospace;color:#7f9187;text-align:right;line-height:1.9;padding-top:8px}
.hero-aside strong{color:var(--teal);font-weight:500}
.section-row{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.section-row h2{margin:0;font-size:15px}.section-row .small{color:var(--muted)}
.grid{display:grid;gap:12px}.agents-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.agent-card{padding:15px}.agent-head{display:flex;align-items:center;gap:10px}.agent-avatar{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:10px;color:var(--teal);font:700 12px "Cascadia Code",Consolas,monospace;background:#ffffff06}
.agent-title{flex:1}.agent-title h3{margin:0}.status{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}.status .symbol{font-size:13px}
.status.idle .symbol{color:var(--green)}.status.running .symbol{color:var(--blue)}.status.limit .symbol{color:var(--amber)}.status.offline .symbol{color:var(--dim)}.status.error .symbol{color:var(--red)}
.agent-meta{display:flex;justify-content:space-between;margin:16px 0 6px;font:11px "Cascadia Code",Consolas,monospace;color:var(--muted)}
.meter{height:5px;border-radius:9px;background:#29332e;position:relative;overflow:visible}
.meter>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#178873,var(--teal));transition:width .6s}
.meter.warn>i{background:linear-gradient(90deg,#b16d21,var(--amber))}
.meter:after{display:none;content:"";position:absolute;left:var(--th,80%);top:-3px;height:11px;width:1px;background:#c3cfc588}
.agent-foot{margin-top:12px;display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
.composer{padding:0;overflow:hidden}
.composer-top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center}
.composer-top h2{margin:0}.compose-body{padding:0 18px 16px}
textarea.task{resize:vertical;min-height:92px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;line-height:1.6}
textarea::placeholder,input::placeholder{color:#66746d}
.compose-options{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:12px 0}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#ffffff04;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:11px}
.chip.selected{border-color:#278f7c;color:#bdf0df;background:#16836e16}
.chip input{accent-color:var(--teal)}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg)}
.field label{font-size:10px;color:var(--dim)}.field input,.field select{min-width:80px;border:0;background:transparent;font-size:11px;outline:0}
.field input:focus-visible,.field select:focus-visible{outline:0}
.compose-bottom{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 18px;background:#ffffff03}
.toggle{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;cursor:pointer}.toggle input{accent-color:var(--teal)}
.spacer{flex:1}.kbd{font:10px "Cascadia Code",Consolas,monospace;padding:3px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--muted)}
.activity-panel{border-top:1px solid var(--line);background:var(--panel);min-height:34px;max-height:205px;display:grid;grid-template-rows:34px minmax(0,1fr)}
.panel-head{display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid #232c28;font-size:11px;color:var(--muted)}
.panel-head strong{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);font-weight:550}
.panel-content{overflow:auto;padding:7px 12px;font:11px/1.8 "Cascadia Code","Cascadia Mono",Consolas,monospace}
.log-line{display:flex;gap:9px;color:#a5b2ab}.log-time{color:#68766f}.log-icon{width:12px}.log-line.ok .log-icon{color:var(--green)}.log-line.warn .log-icon{color:var(--amber)}.log-line.err .log-icon{color:var(--red)}.log-line.info .log-icon{color:var(--blue)}
.panel-filter{margin-left:auto;display:flex;gap:5px}.filter{border:0;border-radius:10px;background:transparent;color:var(--dim);font-size:10px;padding:3px 7px}.filter.active{background:#ffffff0c;color:var(--text)}
.statusbar{grid-column:1/-1;display:flex;align-items:center;gap:15px;padding:0 10px;background:#126e62;border-top:1px solid #48baa4;color:#edfffa;font:10px "Cascadia Code",Consolas,monospace}
.statusbar .right{margin-left:auto;display:flex;gap:14px}
.status-indicator{display:flex;align-items:center;gap:6px}
.statusbar button{border:0;background:transparent;color:inherit;font:inherit;padding:0}
.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}
.metric{padding:15px}.metric .label{color:var(--muted);font-size:11px}.metric .value{font:23px "Cascadia Code",Consolas,monospace;margin-top:5px}.metric .hint{font-size:10px;color:var(--dim);margin-top:3px}
.provider-section{margin-top:23px}.provider-title{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.provider-title h2{margin:0}.provider-title .line{height:1px;background:var(--line);flex:1}
.account-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.account-card{padding:15px}.account-card.full{border-color:#765522;background:linear-gradient(145deg,#292319,#1a1b18)}
.account-title{display:flex;align-items:center;gap:10px}.account-title .agent-avatar{color:var(--amber)}
.account-title h3{margin:0}.account-title .active-badge{font-size:10px;color:var(--teal);border:1px solid #277b6c;border-radius:20px;padding:2px 7px}
.account-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0 9px}
.account-stats span{display:block;color:var(--dim);font-size:10px}.account-stats strong{display:block;font:12px "Cascadia Code",Consolas,monospace;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.actions .btn{padding:6px 8px;font-size:10px}
.empty{padding:32px 18px;text-align:center;border:1px dashed var(--line2);border-radius:13px;color:var(--muted);background:#ffffff02}
.empty-icon{width:40px;height:40px;margin:0 auto 10px;border-radius:13px;display:grid;place-items:center;background:#1b302a;color:var(--teal);font-size:19px}
.empty p{font-size:12px;max-width:380px;margin:5px auto 14px}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;min-height:440px}
.run-list{padding:8px}.run-row{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:var(--muted);text-align:left;padding:11px;margin:3px 0}

.run-row strong{display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.run-row small{font-size:10px;color:var(--dim)}
.run-detail{min-height:300px}.run-summary{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.worker{padding:13px 0;border-bottom:1px solid var(--panel3)}
.worker-head{display:flex;align-items:center;gap:9px}.worker-head strong{font-size:12px}.worker-head .status{margin-left:auto}
.worker-meta{font:10px "Cascadia Code",Consolas,monospace;color:var(--dim);margin:7px 0}
.output{white-space:pre-wrap;max-height:180px;overflow:auto;background:var(--bg);border:1px solid #27312d;border-radius:8px;padding:11px;color:#bfcac4;font:11px/1.65 "Cascadia Code",Consolas,monospace}
.editor-wrap{height:100%;min-height:400px;display:grid;grid-template-columns:minmax(0,1fr) 120px;background:var(--bg)}
.code-area{overflow:auto;padding:16px 0;font:12px/1.85 "Cascadia Code","Cascadia Mono",Consolas,monospace}
.code-line{white-space:pre;display:flex;min-height:22px}.ln{user-select:none;color:#53615a;width:48px;text-align:right;padding-right:15px;border-right:1px solid #202a25;margin-right:16px}
.code{color:#c7d2cb}.kw{color:#d8a8ed}.fn{color:#7bc9e5}.str{color:#c2d883}.num{color:#efb969}.com{color:#75857b;font-style:italic}.key{color:#8bd5c4}
.minimap{border-left:1px solid var(--line);padding:14px 10px;opacity:.45;overflow:hidden}
.mini-line{height:3px;border-radius:4px;margin:3px 0;background:#82988b;opacity:.5}.mini-line:nth-child(3n){background:#b9a276;width:68%}.mini-line:nth-child(4n){width:82%}.mini-line:nth-child(5n){background:#609d8e;width:53%}
.editor-toolbar{display:flex;align-items:center;gap:9px;padding:9px 15px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.editor-toolbar input{background:transparent;border:0;color:var(--muted);font:inherit;width:190px}
.settings-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--panel3)}
.setting-row:last-child{border:0}.setting-row label{font-size:12px}.setting-row small{display:block;color:var(--dim);font-size:10px;margin-top:2px}
.setting-row input[type=number],.setting-row select{width:105px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:11px "Cascadia Code",Consolas,monospace}
.theme-options{display:flex;gap:10px}.theme-choice{width:26px;height:26px;padding:0;border:2px solid var(--line2);border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 3px var(--panel);cursor:pointer}.theme-choice[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}.theme-choice:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

const themeNames={green:'Yeşil',blue:'Mavi',red:'Kırmızı',purple:'Mor',black:'Siyah'},themeColors={green:'var(--accent)',blue:'#5aa9ff',red:'#ff6b6b',purple:'#a78bfa',black:'#e6e6e6'};
function installThemeRow(){if(currentPage!=='settings'||document.querySelector('.theme-options'))return;const card=$('#content .settings-grid .card');if(!card)return;const row=document.createElement('div');row.className='setting-row';row.innerHTML='<span>Tema</span><div class="theme-options" role="group" aria-label="Renk teması"></div>';const group=row.querySelector('.theme-options');Object.keys(themeNames).forEach(name=>{const b=document.createElement('button');b.type='button';b.className='theme-dot';b.title=themeNames[name];b.setAttribute('aria-label',themeNames[name]);b.setAttribute('aria-pressed',document.documentElement.dataset.theme===name?'true':'false');b.style.setProperty('--swatch',themeColors[name]);b.onclick=async()=>{document.documentElement.dataset.theme=name;try{localStorage.setItem('compade-theme',name)}catch(_){}group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));try{await api.saveConfig({theme_color:name});appState.cfg.theme_color=name}catch(e){notify(e.message||String(e))}};group.append(b)});card.insertBefore(row,card.children[1]||null)}
